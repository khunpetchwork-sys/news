<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Pulse — ข่าว AI & ตลาดหุ้น อัปเดตสดอัตโนมัติ 24 ชม.</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', 'Inter', sans-serif; background-color: #0b0f19; color: #f8fafc; }
  </style>
</head>
<body class="min-h-screen bg-[#0b0f19] text-slate-100 antialiased pb-16">

  <!-- Header -->
  <header class="border-b border-slate-800/80 bg-[#0b0f19]/90 backdrop-blur-xl sticky top-0 z-30">
    <div class="max-w-2xl mx-auto px-5 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <span class="text-2xl">⚡</span>
        <div>
          <h1 class="text-base font-bold tracking-tight text-white leading-tight">Daily Pulse</h1>
          <p class="text-[11px] text-slate-400">ดึงข่าวสดจากเว็บอัตโนมัติ 24 ชม.</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="fetchLiveFeeds()" class="p-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition text-xs flex items-center gap-1.5" title="กดดึงข่าวสดใหม่ทันที">
          <span id="refreshSpinner">🔄</span>
          <span class="text-[11px] font-medium hidden sm:inline">ดึงข่าวสด</span>
        </button>
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-300 text-xs font-medium">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="liveStatusText">Live Feed</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-2xl mx-auto px-5 pt-6 sm:pt-8">

    <!-- Tab Selector -->
    <div class="grid grid-cols-2 gap-2 p-1.5 rounded-2xl bg-slate-900/90 border border-slate-800 mb-6">
      <button id="tabAi" onclick="switchTab('ai')" class="py-2.5 rounded-xl font-semibold text-sm transition flex items-center justify-center gap-2 bg-indigo-600 text-white shadow-sm">
        <span>🤖 ข่าว AI สดวันนี้</span>
      </button>
      <button id="tabStock" onclick="switchTab('stock')" class="py-2.5 rounded-xl font-semibold text-sm transition flex items-center justify-center gap-2 text-slate-400 hover:text-white hover:bg-slate-800/50">
        <span>📈 ตลาดหุ้น & พอร์ตสด</span>
      </button>
    </div>

    <!-- Status Banner -->
    <div class="mb-5 px-4 py-2.5 rounded-2xl bg-slate-900/50 border border-slate-800/60 flex items-center justify-between text-xs text-slate-400">
      <span id="feedCountText">กำลังเชื่อมต่อฟีดข่าวสด...</span>
      <span id="lastUpdatedTime">-</span>
    </div>

    <!-- Feed Container -->
    <div class="space-y-4 sm:space-y-5" id="feedContainer">
      <div class="animate-pulse space-y-4">
        <div class="h-28 bg-slate-900 rounded-3xl border border-slate-800"></div>
        <div class="h-28 bg-slate-900 rounded-3xl border border-slate-800"></div>
        <div class="h-28 bg-slate-900 rounded-3xl border border-slate-800"></div>
      </div>
    </div>

  </main>

  <footer class="mt-12 text-center text-xs text-slate-500">
    <p>Daily Pulse • ดึงข้อมูลสดจากแหล่งข่าวสากลอัตโนมัติ</p>
  </footer>

  <script>
    let currentTab = 'ai';
    let aiNews = [];
    let stockNews = [];

    // ดึงฟีดข่าวสดตรงจาก Google News AI & Stock
    const AI_RSS_URL = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent('https://news.google.com/rss/search?q=Artificial+Intelligence+OpenAI+Google+Anthropic+Nvidia&hl=en-US&gl=US&ceid=US:en');
    const STOCK_RSS_URL = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent('https://news.google.com/rss/search?q=S%26P+500+stocks+Nvidia+Gold+price+market&hl=en-US&gl=US&ceid=US:en');

    document.addEventListener('DOMContentLoaded', () => {
      fetchLiveFeeds();
    });

    function switchTab(tab) {
      currentTab = tab;
      const tabAi = document.getElementById('tabAi');
      const tabStock = document.getElementById('tabStock');

      if (tab === 'ai') {
        tabAi.className = "py-2.5 rounded-xl font-semibold text-sm transition flex items-center justify-center gap-2 bg-indigo-600 text-white shadow-sm";
        tabStock.className = "py-2.5 rounded-xl font-semibold text-sm transition flex items-center justify-center gap-2 text-slate-400 hover:text-white hover:bg-slate-800/50";
      } else {
        tabStock.className = "py-2.5 rounded-xl font-semibold text-sm transition flex items-center justify-center gap-2 bg-emerald-600 text-white shadow-sm";
        tabAi.className = "py-2.5 rounded-xl font-semibold text-sm transition flex items-center justify-center gap-2 text-slate-400 hover:text-white hover:bg-slate-800/50";
      }
      renderFeed();
    }

    function timeAgo(dateString) {
      if (!dateString) return 'วันนี้';
      const date = new Date(dateString);
      const now = new Date();
      const diffInMinutes = Math.floor((now - date) / (1000 * 60));
      if (isNaN(diffInMinutes) || diffInMinutes < 0) return 'ล่าสุด';
      if (diffInMinutes < 60) return `เมื่อ ${Math.max(1, diffInMinutes)} นาทีที่แล้ว`;
      const diffInHours = Math.floor(diffInMinutes / 60);
      if (diffInHours < 24) return `เมื่อ ${diffInHours} ชั่วโมงที่แล้ว`;
      const diffInDays = Math.floor(diffInHours / 24);
      return `เมื่อ ${diffInDays} วันที่แล้ว`;
    }

    function cleanTitle(title) {
      if (!title) return '';
      return title.replace(/ - [^-]+$/, '').trim();
    }

    function extractSource(title) {
      const match = title.match(/ - ([^-]+)$/);
      return match ? match.trim() : 'สำนักข่าวสากล';
    }

    async function fetchLiveFeeds() {
      const spinner = document.getElementById('refreshSpinner');
      spinner.classList.add('animate-spin');
      document.getElementById('feedCountText').innerText = 'กำลังโหลดข่าวสดล่าสุด...';

      try {
        const [resAi, resStock] = await Promise.allSettled([
          fetch(AI_RSS_URL).then(r => r.json()),
          fetch(STOCK_RSS_URL).then(r => r.json())
        ]);

        if (resAi.status === 'fulfilled' && resAi.value.items && resAi.value.items.length > 0) {
          aiNews = resAi.value.items.map((item, idx) => ({
            id: 'ai-' + idx,
            tag: idx === 0 ? '🔥 ข่าวเด่น AI' : '🤖 AI & เทคโนโลยี',
            title: cleanTitle(item.title),
            summary: item.description ? item.description.replace(/<[^>]*>?/gm, '').slice(0, 160) + '...' : 'คลิกเพื่ออ่านรายละเอียดข่าวเต็มจากสำนักข่าวต้นทาง',
            source: extractSource(item.title) || item.author || 'Google News AI',
            time: timeAgo(item.pubDate),
            url: item.link
          }));
        }

        if (resStock.status === 'fulfilled' && resStock.value.items && resStock.value.items.length > 0) {
          stockNews = resStock.value.items.map((item, idx) => ({
            id: 'stock-' + idx,
            tag: idx === 0 ? '📊 ข่าวเด่นตลาดหุ้น' : '📈 หุ้น & การลงทุน',
            title: cleanTitle(item.title),
            summary: item.description ? item.description.replace(/<[^>]*>?/gm, '').slice(0, 160) + '...' : 'คลิกเพื่ออ่านรายละเอียดข่าวเต็มจากสำนักข่าวต้นทาง',
            source: extractSource(item.title) || item.author || 'Market News',
            time: timeAgo(item.pubDate),
            url: item.link
          }));
        }

        const now = new Date();
        document.getElementById('lastUpdatedTime').innerText = 'อัปเดต: ' + now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + ' น.';
      } catch (err) {
        console.error('Feed error:', err);
      } finally {
        setTimeout(() => { spinner.classList.remove('animate-spin'); }, 400);
        renderFeed();
      }
    }

    function renderFeed() {
      const container = document.getElementById('feedContainer');
      container.innerHTML = '';
      const items = (currentTab === 'ai') ? aiNews : stockNews;
      const categoryName = (currentTab === 'ai') ? 'ข่าว AI' : 'ตลาดหุ้น';

      if (!items || items.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 rounded-3xl bg-slate-900/40 border border-slate-800/80">
            <p class="text-sm text-slate-400">กำลังเชื่อมต่อฟีดข่าวสด...</p>
            <button onclick="fetchLiveFeeds()" class="mt-3 px-4 py-2 rounded-xl bg-indigo-600 text-xs font-semibold text-white">กดลองใหม่อีกครั้ง</button>
          </div>
        `;
        document.getElementById('feedCountText').innerText = `พร้อมแสดงผล`;
        return;
      }

      document.getElementById('feedCountText').innerText = `พบ ${items.length} ข่าวสดในหมวด${categoryName}`;

      items.forEach(item => {
        const card = document.createElement('article');
        card.className = "p-5 sm:p-6 rounded-3xl bg-slate-900/80 border border-slate-800/90 hover:border-slate-700 transition shadow-sm flex flex-col gap-3 group";
        
        const badgeStyle = (currentTab === 'stock') 
          ? 'bg-emerald-500/10 text-emerald-300 border-emerald-500/20' 
          : 'bg-indigo-500/10 text-indigo-300 border-indigo-500/20';

        card.innerHTML = `
          <div class="flex items-center justify-between gap-2">
            <span class="text-xs font-semibold px-3 py-1 rounded-full border ${badgeStyle}">
              ${item.tag}
            </span>
            <span class="text-[11px] text-slate-400">${item.time}</span>
          </div>

          <h3 class="text-base sm:text-lg font-bold text-white leading-snug group-hover:text-indigo-400 transition-colors">
            <a href="${item.url}" target="_blank" rel="noopener noreferrer">
              ${item.title}
            </a>
          </h3>

          <p class="text-xs sm:text-sm text-slate-300 font-light leading-relaxed">
            ${item.summary}
          </p>

          <div class="pt-2.5 border-t border-slate-800/60 flex items-center justify-between text-xs">
            <span class="text-[11px] text-slate-500 font-medium">${item.source}</span>
            <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="font-medium ${currentTab === 'stock' ? 'text-emerald-400 hover:text-emerald-300' : 'text-indigo-400 hover:text-indigo-300'} flex items-center gap-1">
              อ่านข่าวเต็ม →
            </a>
          </div>
        `;
        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
