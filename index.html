<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Pulse — สรุปข่าว AI & ตลาดหุ้น เข้าใจง่าย</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', 'Inter', sans-serif; background-color: #0b0f19; color: #f8fafc; }
  </style>
</head>
<body class="min-h-screen bg-[#0b0f19] text-slate-100 antialiased pb-16">

  <!-- Header -->
  <header class="border-b border-slate-800/80 bg-[#0b0f19]/80 backdrop-blur-xl sticky top-0 z-30">
    <div class="max-w-2xl mx-auto px-5 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <span class="text-2xl">⚡</span>
        <div>
          <h1 class="text-base font-bold tracking-tight text-white leading-tight">Daily Pulse</h1>
          <p class="text-[11px] text-slate-400">สรุปข่าว AI & พอร์ตหุ้น ภาษาคน</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="fetchLiveNews()" class="p-2 rounded-xl bg-slate-800/60 hover:bg-slate-800 text-slate-400 hover:text-white transition text-xs flex items-center gap-1.5" title="รีเฟรชข้อมูลล่าสุด">
          <span id="refreshSpinner">🔄</span>
          <span class="text-[11px] font-medium hidden sm:inline">รีเฟรช</span>
        </button>
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-300 text-xs font-medium">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="currentDateDisplay">กำลังโหลด...</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-2xl mx-auto px-5 pt-6 sm:pt-8">
    <!-- Tab Selector -->
    <div class="grid grid-cols-2 gap-2 p-1.5 rounded-2xl bg-slate-900/90 border border-slate-800 mb-6">
      <button id="tabAi" onclick="switchTab('ai')" class="py-2.5 rounded-xl font-semibold text-sm transition flex items-center justify-center gap-2 bg-indigo-600 text-white shadow-sm">
        <span>🤖 ข่าว AI ประจำวัน</span>
      </button>
      <button id="tabStock" onclick="switchTab('stock')" class="py-2.5 rounded-xl font-semibold text-sm transition flex items-center justify-center gap-2 text-slate-400 hover:text-white hover:bg-slate-800/50">
        <span>📈 ตลาดหุ้น & พอร์ต</span>
      </button>
    </div>

    <!-- Feed Container -->
    <div class="space-y-5" id="feedContainer">
      <div class="text-center py-12 text-slate-500 text-sm flex flex-col items-center justify-center gap-3">
        <span class="text-2xl animate-spin">🔄</span>
        <span>กำลังดึงข้อมูลสดจากฐานข้อมูล...</span>
      </div>
    </div>
  </main>

  <footer class="mt-12 text-center text-xs text-slate-500">
    <p>Daily Pulse • ดึงข้อมูลสดจาก Google Sheets อัตโนมัติ</p>
  </footer>

  <script>
    const SPREADSHEET_ID = '1l4JjYvBros8t8UaVxTpmeMou4WsiwoOJmcvkX_BW0u8';
    const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json`;

    let allData = [];
    let currentTab = 'ai';

    document.addEventListener('DOMContentLoaded', () => {
      fetchLiveNews();
    });

    function switchTab(tab) {
      currentTab = tab;
      const tabAi = document.getElementById('tabAi');
      const tabStock = document.getElementById('tabStock');

      if (tab === 'ai') {
        tabAi.className = "py-2.5 rounded-xl font-semibold text-sm transition flex items-center justify-center gap-2 bg-indigo-600 text-white shadow-sm";
        tabStock.className = "py-2.5 rounded-xl font-semibold text-sm transition flex items-center justify-center gap-2 text-slate-400 hover:text-white hover:bg-slate-800/50";
      } else {
        tabStock.className = "py-2.5 rounded-xl font-semibold text-sm transition flex items-center justify-center gap-2 bg-emerald-600 text-white shadow-sm";
        tabAi.className = "py-2.5 rounded-xl font-semibold text-sm transition flex items-center justify-center gap-2 text-slate-400 hover:text-white hover:bg-slate-800/50";
      }
      renderFeed();
    }

    function renderFeed() {
      const container = document.getElementById('feedContainer');
      container.innerHTML = '';

      const items = allData.filter(item => item.type === currentTab);

      if (items.length === 0) {
        container.innerHTML = '<div class="text-center py-12 text-slate-500 text-sm">ไม่พบรายการข้อมูลในหมวดนี้</div>';
        return;
      }

      items.forEach(item => {
        const card = document.createElement('article');
        card.className = "p-5 sm:p-6 rounded-3xl bg-slate-900/80 border border-slate-800/90 hover:border-slate-700 transition shadow-sm flex flex-col gap-3.5";

        const badgeColor = item.type === 'stock' 
          ? 'bg-emerald-500/10 text-emerald-300 border-emerald-500/20' 
          : 'bg-indigo-500/10 text-indigo-300 border-indigo-500/20';

        card.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold px-3 py-1 rounded-full border ${badgeColor}">
              ${item.tag}
            </span>
            <span class="text-[11px] text-slate-400">${item.date}</span>
          </div>

          <h3 class="text-base sm:text-lg font-bold text-white leading-snug">
            ${item.title}
          </h3>

          <div class="space-y-2 text-xs sm:text-sm text-slate-300 leading-relaxed font-light">
            <div class="flex items-start gap-2">
              <span class="text-sm">📌</span>
              <p><strong class="text-white font-medium">เรื่องคือ:</strong> ${item.what}</p>
            </div>
            <div class="flex items-start gap-2">
              <span class="text-sm">💡</span>
              <p><strong class="text-white font-medium">มุมมอง / ประโยชน์:</strong> ${item.benefit}</p>
            </div>
          </div>

          <div class="pt-2.5 border-t border-slate-800/60 flex items-center justify-between">
            <span class="text-[11px] text-slate-500">แหล่งข่าว: ${item.source}</span>
            <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="text-xs font-medium ${item.type === 'stock' ? 'text-emerald-400 hover:text-emerald-300' : 'text-indigo-400 hover:text-indigo-300'} flex items-center gap-1">
              อ่านเพิ่มเติม →
            </a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function fetchLiveNews() {
      const spinner = document.getElementById('refreshSpinner');
      spinner.classList.add('animate-spin');
      try {
        const response = await fetch(GVIZ_URL);
        const text = await response.text();
        const jsonMatch = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);/);
        
        if (jsonMatch && jsonMatch) {
          const data = JSON.parse(jsonMatch);
          const rows = data.table.rows;
          if (rows && rows.length > 0) {
            const parsed = rows.map((r, index) => {
              const c = r.c;
              const cat = (c && c[2] && c[2].v) ? String(c[2].v) : '';
              const isStock = cat.includes('ตลาดหุ้น') || cat.includes('พอร์ต') || cat.includes('หุ้น') || cat.includes('ทองคำ');
              
              const titleVal = (c && c[3] && c[3].v) ? String(c[3].v) : '';
              let tagVal = cat;
              if (isStock && titleVal.includes(':')) {
                tagVal = titleVal.split(':')[0].trim();
              }

              return {
                id: (c && c[0] && c[0].v) ? c[0].v : (index + 1),
                date: (c && c && c.v) ? String(c.v) : '',
                type: isStock ? 'stock' : 'ai',
                tag: tagVal || (isStock ? 'การลงทุน' : 'AI News'),
                title: titleVal,
                what: (c && c[4] && c[4].v) ? String(c[4].v) : '',
                benefit: (c && c[5] && c[5].v) ? String(c[5].v) : '',
                source: (c && c[6] && c[6].v) ? String(c[6].v) : 'แหล่งข่าว',
                url: (c && c[7] && c[7].v) ? String(c[7].v) : '#'
              };
            }).filter(item => item.title && item.title !== 'Title' && item.title !== 'หัวข้อ');

            if (parsed.length > 0) {
              // เรียงจากใหม่สุดไปเก่าสุด ข่าวของวันนี้จะอยู่บนสุดเสมอ
              allData = parsed.reverse();
              document.getElementById('currentDateDisplay').innerText = allData[0].date || 'ล่าสุด';
              renderFeed();
            }
          }
        }
      } catch (err) {
        console.error('Fetch error:', err);
        document.getElementById('feedContainer').innerHTML = '<div class="text-center py-12 text-red-400 text-sm">ไม่สามารถโหลดข้อมูลได้ กรุณากดปุ่มรีเฟรชอีกครั้ง</div>';
      } finally {
        setTimeout(() => { spinner.classList.remove('animate-spin'); }, 500);
      }
    }
  </script>
</body>
</html>
